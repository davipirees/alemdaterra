<!-- Interface do diário. O conteúdo didático dos painéis é fornecido por js/data.js. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="Explore stories of five Moon and Mars explorers, then build a rover in an educational mini game.">
    <meta name="theme-color" content="#121716">
    <title>Beyond Earth: exploring the story of space missions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/experience.css">
    <script defer src="js/data.js"></script>
    <script defer src="js/locales.js"></script>
    <script defer src="js/mini-game-data.js"></script>
    <script defer src="js/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#tab-panels">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a class="wordmark" href="#inicio" aria-label="Mission log, return to home">
          <span class="wordmark__star" aria-hidden="true">✦</span>
          <span class="wordmark__text"><strong>MISSION</strong> <span>LOG</span></span>
        </a>
        <div class="language-picker">
          <label class="visually-hidden" for="language-select">Language</label>
          <select id="language-select" aria-label="Language">
            <option value="en" selected>English</option>
            <option value="pt-BR">Português (Brasil)</option>
          </select>
        </div>
        <div class="route-progress" aria-label="Mission route progress">
          <div class="route-progress__top"><span id="route-progress-label">Mission route</span><span id="route-progress-value">0%</span></div>
          <div class="route-progress__track" role="progressbar" aria-label="Missions explored" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="route-progress-bar"><span id="route-progress-fill"></span></div>
          <span class="route-progress__detail" id="route-progress-detail">0 of 5 missions explored</span>
        </div>
        <button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-controls="tab-list" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <span>Menu</span>
        </button>
        <nav id="tab-list" class="tab-list" role="tablist" aria-label="Exhibit sections" aria-orientation="horizontal"></nav>
      </header>

      <div id="completion-banner" class="completion-banner" role="status" aria-live="polite" hidden>
        <div><strong id="completion-title"></strong><span id="completion-copy"></span></div>
        <button class="button button--bright" id="completion-mini-game" type="button"></button>
      </div>

      <main id="tab-panels" class="tab-panels" tabindex="-1" aria-label="Exhibit content"></main>

      <aside class="elaine-dock" aria-label="Elaine" hidden>
        <div class="elaine-dock__bubble" id="elaine-message" role="status" aria-live="polite" hidden></div>
        <button class="elaine-dock__button" id="elaine-toggle" type="button" aria-expanded="false" aria-controls="elaine-message" aria-label="Toggle Elaine’s messages">
          <span class="elaine-dock__portrait" aria-hidden="true">
            <img src="assets/elaine-astronaut-clean-v2.png" alt="" loading="eager" decoding="async">
          </span>
          <span class="elaine-dock__hint-count" id="elaine-hint-count" aria-hidden="true" hidden></span>
        </button>
      </aside>

      <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
        <div id="dialog-content"></div>
      </dialog>
    </div>
  </body>
</html>
